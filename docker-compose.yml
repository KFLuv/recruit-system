name: recruitment-system

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: recruitment_mysql
    environment:
      MYSQL_ROOT_PASSWORD: <your-password>
      MYSQL_DATABASE: recruitment_db
      MYSQL_USER: recruitment
      MYSQL_PASSWORD: recruitment123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p<your-password>"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recruitment_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recruitment_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: recruitment
      SPRING_DATASOURCE_PASSWORD: recruitment123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      # 飞书密钥从项目根目录的 .env 读取（.env 已在 .gitignore 中，不会提交）
      # Compose 会自动读取同目录 .env 做变量插值；缺省为空 → 飞书通知自动跳过，不影响启动
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
    ports:
      - "8082:8082"
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务（Nginx）
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: recruitment_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql-data:
  backend-logs:
  backend-uploads:
